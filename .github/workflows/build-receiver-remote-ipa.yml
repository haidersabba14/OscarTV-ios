name: Build Receiver Remote IPA

on:
  push:
    branches: [codex/receiver-remote-ipa, codex/receiver-full-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test press-and-hold and shortcut behavior
        working-directory: ReceiverRemote/Core
        run: swift test
      - name: Generate Xcode project
        working-directory: ReceiverRemote
        run: xcodegen generate --spec project.yml
      - name: Build iPhone app and package IPA
        working-directory: ReceiverRemote
        run: |
          set -euo pipefail
          xcodebuild -project ReceiverRemote.xcodeproj -scheme ReceiverRemote \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || { tail -100 build-device.log; exit 1; }
          mkdir -p Payload
          cp -R 'build/DerivedData/Build/Products/Release-iphoneos/Receiver Remote.app' Payload/
          zip -qr Receiver-Remote.ipa Payload
          unzip -t Receiver-Remote.ipa
      - name: Compile simulator app and interface tests
        working-directory: ReceiverRemote
        run: |
          xcodebuild -project ReceiverRemote.xcodeproj -scheme ReceiverRemote \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO \
            build-for-testing > build-simulator-compile.log 2>&1 || { tail -100 build-simulator-compile.log; exit 1; }
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Receiver-Remote-IPA
          path: ReceiverRemote/Receiver-Remote.ipa
          if-no-files-found: error
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Receiver-Remote-Build-Log
          path: |
            ReceiverRemote/build-device.log
            ReceiverRemote/build-simulator-compile.log
          if-no-files-found: warn
