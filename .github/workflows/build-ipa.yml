
name: Build OscarTV IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -q OscarTV_iOS_Prototype_Xcode.zip -d extracted

      - name: Build iPhone App
        run: |
          xcodebuild \
            -project extracted/OscarTV_iOS_Web_Prototype/OscarTV_Web.xcodeproj \
            -scheme OscarTV_Web \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/OscarTV_Web.app Payload/
          zip -qr OscarTV.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OscarTV-IPA
          path: OscarTV.ipa
